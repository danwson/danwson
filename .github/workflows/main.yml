name: Atualiza README

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia às 06:00 UTC (~03:00 horário de Brasília)
  push:
    branches: [main]
  workflow_dispatch: {}    # permite rodar manualmente pela aba Actions

permissions:
  contents: write   # só o necessário: ler o repo e commitar de volta

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependências
        run: pip install requests

      - name: Gera SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # token automático, sem setup manual
        run: python today.py

      - name: Comita mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || git commit -m "Atualiza stats do README"
          git push
